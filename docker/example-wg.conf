# Example WireGuard configuration
# Copy this template and fill in your VPN provider's details.
# Save as ~/.config/aria-tui/wireguard/<name>.conf
# Or use: aria-tui import <file>.conf

[Interface]
PrivateKey = YOUR_PRIVATE_KEY_HERE
Address = 10.0.0.2/24
DNS = 1.1.1.1

[Peer]
PublicKey = SERVER_PUBLIC_KEY_HERE
Endpoint = vpn-server.example.com:51820
AllowedIPs = 0.0.0.0/0
PersistentKeepalive = 25
